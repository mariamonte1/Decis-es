<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DECISÕES — Simulação de Educação Financeira</title>
<style>
:root{
  --azul:#2563eb; --azul-d:#1e40af; --azul-l:#dbeafe;
  --navy:#0b1a35; --navy2:#12294d;
  --card:#ffffff; --bg:#f4f7fc; --txt:#0f172a; --mut:#64748b; --line:#e5eaf2;
  --verde:#0f9d63; --verde-l:#e7f7ef;
  --amar:#c98a04; --amar-l:#fdf5e1;
  --verm:#d14343; --verm-l:#fdecec;
  --rad:18px; --sh:0 12px 34px rgba(8,22,50,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--txt);
  background:
    radial-gradient(1100px 620px at 50% -12%, #163b72 0%, transparent 0%),
    radial-gradient(1100px 620px at 50% -12%, #1d4585 0%, #0b1a35 62%);
  background-attachment:fixed; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:980px;margin:0 auto;padding:20px 16px 70px}
.fade{animation:fade .45s cubic-bezier(.22,.8,.3,1) both}
.up{animation:up .5s cubic-bezier(.22,.8,.3,1) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:22px}
h1,h2,h3,h4{margin:0;line-height:1.18;letter-spacing:-.02em}
p{line-height:1.6}
.mut{color:var(--mut)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  border:0;cursor:pointer;font:inherit;font-weight:700;letter-spacing:.02em;
  padding:15px 26px;border-radius:14px;background:var(--azul);color:#fff;
  transition:transform .15s, box-shadow .2s, background .2s; box-shadow:0 8px 22px rgba(37,99,235,.32);
}
.btn:hover{transform:translateY(-2px);background:var(--azul-d)}
.btn:active{transform:translateY(0)}
.btn[disabled]{background:#c3cddd;color:#fff;cursor:not-allowed;box-shadow:none;transform:none}
.btn.ghost{background:transparent;color:var(--azul);box-shadow:none;border:1.5px solid var(--line)}
.btn.ghost:hover{background:#f2f6fd;color:var(--azul-d)}
.btn.lg{padding:18px 40px;font-size:1.05rem;width:100%;max-width:420px}
.btn.dark{background:#0f2547;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.center{text-align:center}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- CAPA ---------- */
.hero{color:#fff;text-align:center;padding:34px 10px 10px}
.hero .kicker{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.22em;
  color:#a9c6ff;border:1px solid rgba(169,198,255,.35);padding:7px 14px;border-radius:99px;margin-bottom:22px}
.hero h1{font-size:clamp(2.4rem,8vw,4.2rem);font-weight:900}
.hero h1 span{background:linear-gradient(90deg,#7fb0ff,#dbe9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-size:clamp(1rem,2.6vw,1.22rem);color:#c7d8f5;margin:14px auto 4px;max-width:600px;line-height:1.55}
.hero .frase{color:#8fb2e8;font-style:italic;margin-top:18px;font-size:.98rem}
.heroart{margin:6px auto 20px;max-width:440px}
.pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0 6px}
.pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#d5e4fb;
  padding:9px 15px;border-radius:99px;font-size:.82rem;font-weight:600}

/* ---------- PERFIS ---------- */
.sechead{color:#fff;text-align:center;margin:6px 0 26px}
.sechead h2{font-size:clamp(1.5rem,4.4vw,2.1rem);font-weight:800}
.sechead p{color:#a7c0e6;margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.perfil{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);overflow:hidden;
  display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;border-top:5px solid var(--azul)}
.perfil:hover{transform:translateY(-5px);box-shadow:0 20px 44px rgba(8,22,50,.2)}
.perfil .top{padding:18px 20px 6px;display:flex;gap:14px;align-items:center}
.perfil .ava{width:70px;height:70px;flex:0 0 70px}
.perfil h3{font-size:1.12rem}
.perfil .tag{font-size:.7rem;font-weight:800;letter-spacing:.12em;color:var(--azul);text-transform:uppercase}
.perfil .desc{padding:4px 20px 0;color:var(--mut);font-size:.93rem;line-height:1.55;min-height:56px}
.perfil .nums{margin:14px 20px;background:#f7f9fd;border-radius:12px;padding:12px 14px;display:grid;gap:7px}
.perfil .nums div{display:flex;justify-content:space-between;font-size:.86rem}
.perfil .nums b{font-variant-numeric:tabular-nums}
.perfil .goal{margin:0 20px 12px;font-size:.86rem;color:var(--txt);background:var(--azul-l);
  border-radius:10px;padding:10px 12px;line-height:1.45}
.perfil .act{padding:0 20px 20px;margin-top:auto}
.perfil .act .btn{width:100%}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:30;background:rgba(9,24,50,.86);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:12px 14px;margin-bottom:18px;color:#fff}
.hud .l1{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.hud .mes{font-size:.74rem;font-weight:800;letter-spacing:.16em;color:#9dbdf0}
.hud .pf{font-size:.74rem;font-weight:700;color:#c9dcfa;background:rgba(255,255,255,.09);padding:5px 11px;border-radius:99px}
.dots{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.dots i{height:6px;flex:1;border-radius:99px;background:rgba(255,255,255,.16);transition:background .4s}
.dots i.on{background:linear-gradient(90deg,#4f8ff7,#8ab6ff)}
.dots i.now{background:#fff;box-shadow:0 0 12px rgba(255,255,255,.7)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{background:rgba(255,255,255,.07);border-radius:11px;padding:9px 10px;min-width:0}
.chip .k{font-size:.66rem;color:#9fb9de;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .v{font-size:.98rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.chip.g .v{color:#5fe0a8} .chip.r .v{color:#ff9a9a} .chip.y .v{color:#ffd479}
.chip .bar{height:4px;border-radius:99px;background:rgba(255,255,255,.16);margin-top:6px;overflow:hidden}
.chip .bar b{display:block;height:100%;background:#5fe0a8;border-radius:99px;transition:width .7s cubic-bezier(.22,.8,.3,1)}
.chip.flash{animation:pulse .5s ease}
.extra{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.extra span{font-size:.74rem;background:rgba(255,255,255,.07);color:#d7e5fa;padding:6px 10px;border-radius:99px}

/* ---------- CENAS ---------- */
.scene{padding:26px}
.scene .tag{display:inline-block;font-size:.68rem;font-weight:900;letter-spacing:.18em;
  color:var(--azul);background:var(--azul-l);padding:6px 12px;border-radius:99px;margin-bottom:14px}
.scene .tag.ev{color:var(--amar);background:var(--amar-l)}
.scene .tag.al{color:var(--verm);background:var(--verm-l)}
.scene h2{font-size:clamp(1.35rem,4vw,1.75rem);margin-bottom:12px}
.scene .txt{color:#334155;font-size:1.02rem;line-height:1.68;margin:0 0 6px}
.ilu{width:100%;max-width:150px;height:auto;display:block}
.ilubox{float:right;margin:0 0 10px 18px;background:#f4f7fd;border-radius:16px;padding:14px;width:170px}
.opts{display:grid;gap:12px;margin-top:22px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
  background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;
  font:inherit;transition:border-color .18s,transform .18s,box-shadow .18s,background .18s}
.opt:hover{border-color:#a9c5f6;transform:translateY(-2px);box-shadow:0 10px 24px rgba(37,99,235,.12)}
.opt .letra{flex:0 0 34px;height:34px;border-radius:10px;background:#f0f4fc;color:var(--azul);
  display:flex;align-items:center;justify-content:center;font-weight:900}
.opt .tt{font-weight:700;font-size:1.02rem;line-height:1.35}
.opt .dd{color:var(--mut);font-size:.9rem;margin-top:4px}
.opt.sel{border-color:var(--azul);background:#f5f9ff;box-shadow:0 10px 26px rgba(37,99,235,.16)}
.opt.sel .letra{background:var(--azul);color:#fff}
.opt.off{opacity:.42;pointer-events:none}
.warn{display:inline-block;margin-top:7px;font-size:.74rem;font-weight:700;color:var(--amar);
  background:var(--amar-l);padding:4px 9px;border-radius:99px}
.warn.red{color:var(--verm);background:var(--verm-l)}
.acts{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- EXTRATO ---------- */
.extrato{margin-top:18px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.extrato .h{background:#f7f9fd;padding:11px 16px;font-size:.72rem;font-weight:800;letter-spacing:.14em;color:var(--mut)}
.extrato .it{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line);font-size:.94rem}
.extrato .it b{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--verde)} .neg{color:var(--verm)} .neu{color:var(--mut)}
.extrato .tot{display:flex;justify-content:space-between;padding:13px 16px;border-top:2px solid var(--line);background:#fbfcfe;font-weight:800}

/* ---------- CONSEQUÊNCIA ---------- */
.conseq{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:20px 0}
.snap{background:#f7f9fd;border-radius:14px;padding:16px;text-align:center}
.snap .k{font-size:.66rem;letter-spacing:.16em;font-weight:800;color:var(--mut)}
.snap .v{font-size:1.5rem;font-weight:900;margin-top:6px;font-variant-numeric:tabular-nums}
.snap.after{background:var(--azul-l)}
.arrow{font-size:1.5rem;color:var(--azul);font-weight:900}
.deltas{display:grid;gap:8px;margin-top:6px}
.delta{display:flex;justify-content:space-between;background:#f7f9fd;border-radius:11px;padding:11px 14px;font-size:.92rem}
.delta b{font-variant-numeric:tabular-nums}
.lesson{margin-top:20px;border-left:4px solid var(--azul);background:#f6f9ff;border-radius:0 12px 12px 0;padding:16px 18px}
.lesson .k{font-size:.68rem;font-weight:900;letter-spacing:.16em;color:var(--azul);margin-bottom:7px}
.lesson p{margin:0;color:#334155;font-size:.97rem;line-height:1.65}

/* ---------- FECHAMENTO ---------- */
.alloc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.pot{background:#f7f9fd;border-radius:14px;padding:14px;text-align:center;transition:background .3s}
.pot .k{font-size:.68rem;color:var(--mut);font-weight:800;letter-spacing:.06em}
.pot .v{font-size:1.12rem;font-weight:900;margin-top:5px;font-variant-numeric:tabular-nums}
.pot.on{background:var(--azul-l)}
.mover{background:#fbfcff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:6px}
.mover input{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font:inherit;
  font-size:1.15rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.mover input:focus{outline:0;border-color:var(--azul)}
.quick{display:flex;gap:8px;margin:10px 0}
.quick button{flex:1;background:#eef3fc;border:0;border-radius:10px;padding:9px;font:inherit;
  font-weight:700;font-size:.84rem;color:var(--azul);cursor:pointer}
.quick button:hover{background:#e0eafc}
.dest{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dest button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px 10px;font:inherit;
  font-weight:700;font-size:.88rem;cursor:pointer;transition:border-color .2s,background .2s}
.dest button:hover{border-color:var(--azul);background:#f5f9ff}
.dest button[disabled]{opacity:.4;pointer-events:none}
.hist{margin-top:14px;font-size:.86rem;color:var(--mut)}

/* ---------- FINAL ---------- */
.final-hero{color:#fff;text-align:center;margin-bottom:24px}
.final-hero h2{font-size:clamp(1.8rem,6vw,2.8rem);font-weight:900}
.final-hero p{color:#a9c4ea;margin-top:8px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.res .b{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--sh)}
.res .b .k{font-size:.68rem;font-weight:800;letter-spacing:.1em;color:var(--mut)}
.res .b .v{font-size:1.32rem;font-weight:900;margin-top:6px;font-variant-numeric:tabular-nums}
.diag{border-radius:var(--rad);padding:26px;color:#fff;box-shadow:var(--sh);margin:18px 0}
.diag .k{font-size:.7rem;font-weight:900;letter-spacing:.2em;opacity:.85}
.diag h3{font-size:clamp(1.7rem,6vw,2.4rem);font-weight:900;margin:8px 0 10px}
.diag p{margin:0;opacity:.94;line-height:1.6}
.score{display:flex;align-items:center;gap:16px;margin-top:20px;background:rgba(255,255,255,.14);border-radius:14px;padding:14px 18px}
.score .n{font-size:2.2rem;font-weight:900;line-height:1}
.score .bar{flex:1;height:9px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.score .bar b{display:block;height:100%;background:#fff;border-radius:99px;transition:width 1.1s cubic-bezier(.22,.8,.3,1)}
.pontos{display:grid;gap:10px;margin-top:8px}
.ponto{display:flex;gap:11px;background:#f7f9fd;border-radius:12px;padding:13px 15px;font-size:.94rem;line-height:1.55}
.chips2{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.chips2 button{background:#f2f6fd;border:2px solid transparent;border-radius:11px;padding:11px 14px;
  font:inherit;font-size:.86rem;cursor:pointer;text-align:left;max-width:100%}
.chips2 button:hover{border-color:var(--azul)}
.chips2 button.sel{border-color:var(--azul);background:#fff}
.chips2 button small{display:block;color:var(--mut);margin-top:3px}

@media(max-width:720px){
  #app{padding:14px 12px 60px}
  .grid,.res,.alloc{grid-template-columns:1fr}
  .res{grid-template-columns:repeat(2,1fr)}
  .alloc{grid-template-columns:repeat(2,1fr)}
  .chips{grid-template-columns:repeat(2,1fr)}
  .scene{padding:20px 17px}
  .card{padding:18px}
  .ilubox{float:none;margin:0 auto 16px;width:120px}
  .conseq{grid-template-columns:1fr;gap:8px}
  .arrow{transform:rotate(90deg);text-align:center}
  .dest{grid-template-columns:1fr}
  .btn{width:100%}
  .acts .btn.ghost{width:auto}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* =====================================================================================
   1) CONFIGURAÇÃO CENTRAL — altere aqui valores, perfis, rendas, despesas e regras
   ===================================================================================== */
const CONFIG = {
  renda: 2000,
  internet: 57.90,
  jurosDivida: 0.07,     // juros mensais sobre o saldo devedor
  rendReserva: 0.004,    // rendimento mensal da reserva
  rendInvest:  0.009,    // rendimento mensal dos investimentos
  meses: 6,
  mesesInfo: [
    {n:1, titulo:'O COMEÇO',                        tema:'Organização financeira'},
    {n:2, titulo:'VOCÊ JÁ TEM COMPROMISSOS',        tema:'Consumo, crédito e parcelamento'},
    {n:3, titulo:'O DINHEIRO NÃO ESQUECE',          tema:'Liquidez, oportunidades e manutenção'},
    {n:4, titulo:'NEM TUDO ACONTECE QUANDO VOCÊ ESPERA', tema:'Consequências e imprevistos'},
    {n:5, titulo:'EU MEREÇO',                       tema:'Desejo, recompensa e prioridade'},
    {n:6, titulo:'AGORA É COM VOCÊ',                tema:'Decisão de longo prazo'}
  ],
  perfis:{
    p1:{ id:'p1', nome:'PRIMEIRO PASSO', tag:'Mora com a família', cor:'#2563eb', ava:'ava1',
      desc:'Está começando a administrar o próprio dinheiro e sente que sobra bastante todo mês.',
      dinheiro:500, reserva:0, invest:0, divida:0, vr:0, parcelaMinima:150,
      despesas:[{nome:'Ajuda em casa',valor:250},{nome:'Transporte',valor:200}],
      objetivo:{label:'Reserva de R$ 3.000', meta:3000, tipo:'reserva'},
      desafio:'Consumo e a sensação de que existe muito dinheiro disponível.' },
    p2:{ id:'p2', nome:'INDEPENDÊNCIA', tag:'Mora sozinho(a)', cor:'#0f9d63', ava:'ava2',
      desc:'Mora sozinho(a), paga todas as contas e tem pouca margem para erros.',
      dinheiro:700, reserva:300, invest:0, divida:0, vr:500, parcelaMinima:150,
      despesas:[{nome:'Aluguel',valor:650},{nome:'Energia',valor:100},{nome:'Água',valor:50},{nome:'Transporte',valor:200}],
      objetivo:{label:'Reserva de R$ 2.500', meta:2500, tipo:'reserva'},
      desafio:'Custo de vida alto, organização do VR e pouca folga.' },
    p3:{ id:'p3', nome:'RECOMEÇO', tag:'Começa com dívida', cor:'#d14343', ava:'ava3',
      desc:'Começa a jornada devendo R$ 1.500 e pagando parcela mínima todo mês.',
      dinheiro:300, reserva:100, invest:0, divida:1500, vr:0, parcelaMinima:250,
      despesas:[{nome:'Transporte',valor:250},{nome:'Alimentação',valor:400}],
      objetivo:{label:'Quitar a dívida + R$ 1.000 de reserva', meta:1000, tipo:'quitar', dividaInicial:1500},
      desafio:'Crédito, juros e o ciclo do endividamento.' },
    p4:{ id:'p4', nome:'OBJETIVO MAIOR', tag:'Meta específica', cor:'#7c3aed', ava:'ava4',
      desc:'Mora com a família e quer juntar R$ 5.000 para realizar um projeto pessoal.',
      dinheiro:1500, reserva:500, invest:0, divida:0, vr:0, parcelaMinima:150,
      despesas:[{nome:'Ajuda em casa',valor:300},{nome:'Transporte',valor:200},{nome:'Alimentação',valor:250}],
      objetivo:{label:'Juntar R$ 5.000 para o projeto', meta:5000, tipo:'reserva'},
      desafio:'Equilibrar objetivo, consumo e segurança.' }
  }
};

/* ===================== UTILITÁRIOS ===================== */
const app = document.getElementById('app');
const r2 = v => Math.round((v + Number.EPSILON)*100)/100;
const fmt = v => 'R$ ' + r2(Math.abs(v)).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const sgn = v => (v>=0?'+ ':'− ') + fmt(v);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ===================== ILUSTRAÇÕES SVG ===================== */
const ILU = {
  ava1:`<svg class="ava" viewBox="0 0 80 80"><circle cx="40" cy="40" r="38" fill="#dbeafe"/><circle cx="40" cy="32" r="13" fill="#2563eb"/><path d="M16 70c2-14 12-21 24-21s22 7 24 21z" fill="#1e40af"/><circle cx="60" cy="20" r="9" fill="#93c5fd"/><path d="M56 20h8M60 16v8" stroke="#1e40af" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  ava2:`<svg class="ava" viewBox="0 0 80 80"><circle cx="40" cy="40" r="38" fill="#dcfce7"/><circle cx="40" cy="32" r="13" fill="#0f9d63"/><path d="M16 70c2-14 12-21 24-21s22 7 24 21z" fill="#0b7a4c"/><path d="M50 22l10-8 10 8v11H50z" fill="#86efac"/><rect x="57" y="26" width="6" height="7" fill="#0b7a4c"/></svg>`,
  ava3:`<svg class="ava" viewBox="0 0 80 80"><circle cx="40" cy="40" r="38" fill="#fee2e2"/><circle cx="40" cy="32" r="13" fill="#d14343"/><path d="M16 70c2-14 12-21 24-21s22 7 24 21z" fill="#a52f2f"/><rect x="48" y="14" width="24" height="15" rx="3" fill="#fca5a5"/><rect x="48" y="19" width="24" height="4" fill="#a52f2f"/></svg>`,
  ava4:`<svg class="ava" viewBox="0 0 80 80"><circle cx="40" cy="40" r="38" fill="#ede9fe"/><circle cx="40" cy="32" r="13" fill="#7c3aed"/><path d="M16 70c2-14 12-21 24-21s22 7 24 21z" fill="#5b21b6"/><circle cx="61" cy="21" r="10" fill="#c4b5fd"/><circle cx="61" cy="21" r="4" fill="#5b21b6"/></svg>`,

let state = null;
const SAVE_KEY = 'decisoes_save_v1';

function novoEstado(perfilId){

    dinheiro:p.dinheiro, reserva:p.reserva, invest:p.invest, divida:p.divida, vr:0,

    parcelas: [],
    flags:{},
    historico:[],

            patrimonio: p.dinheiro+p.reserva+p.invest-p.divida}],

  };
}
const perfil = () => CONFIG.perfis[state.perfilId];
function sane(){ ['dinheiro','reserva','invest','divida','vr'].forEach(k=>state[k]=r2(state[k])); }
function salvar(){ try{ const {cenas,...s}=state; localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }catch(e){} }

/* ===================== MOTOR FINANCEIRO ===================== */
function pagar(st, valor, desc){
  let falta = valor, det = [];
  const d = Math.min(Math.max(st.dinheiro,0), falta);
  st.dinheiro -= d; falta -= d; if(d>0.005) det.push(fmt(d)+' do dinheiro disponível');
  if(falta>0.005){ const r=Math.min(st.reserva,falta); st.reserva-=r; falta-=r;
    if(r>0.005){ det.push(fmt(r)+' da reserva'); st.flags.usouReserva=true; } }
  if(falta>0.005 && !st.flags.investBloqueado){ const i=Math.min(st.invest,falta); st.invest-=i; falta-=i;
    if(i>0.005){ det.push(fmt(i)+' resgatado do investimento'); st.flags.resgatou=true; } }
  if(falta>0.005){ st.divida+=falta; st.flags.usouCredito=true;
    st.flags.qtdCredito=(st.flags.qtdCredito||0)+1; det.push(fmt(falta)+' no crédito (virou dívida)'); }
  sane();
  return { texto: det.length? ('Origem do pagamento: '+det.join(' + ')+'.') : '' };
}
function addParcela(st, nome, valor, total){
  st.dinheiro -= valor;                     // 1ª parcela cobrada no ato
  st.parcelas.push({nome, valor, total, restantes: total-1});
  st.flags.parcelou = (st.flags.parcelou||0)+1;
  equilibrarSilencioso(st); sane();
}
function equilibrarSilencioso(st){
  if(st.dinheiro < -0.005){
    let falta=-st.dinheiro; st.dinheiro=0;
    const r=Math.min(st.reserva,falta); st.reserva-=r; falta-=r; if(r>0) st.flags.usouReserva=true;
    if(falta>0.005){ st.divida+=falta; st.flags.usouCredito=true; }
  }
}
const parcelasMensais = st => st.parcelas.reduce((a,p)=>a+(p.restantes>0?p.valor:0),0);
const compromissosFuturos = st => st.parcelas.reduce((a,p)=>a+p.valor*p.restantes,0);
const despesasFixas = st => st.despesas.reduce((a,d)=>a+d.valor,0);
function custoMensalTotal(st){
  let t = despesasFixas(st) + parcelasMensais(st);
  if(st.divida>0) t += Math.min(st.divida, Math.max(perfil().parcelaMinima, st.divida*0.12));
  if(perfil().vr) t += Math.max(0,(st.flags.consumoAlim ?? 470) - perfil().vr);
  return t;
}
function progressoObjetivo(st){
  const o = perfil().objetivo;
  if(st.flags.objetivoRealizado) return 1;
  if(o.tipo==='quitar'){
    const dv = clamp(1 - st.divida/o.dividaInicial, 0, 1);
    const rs = clamp((st.reserva+st.invest)/o.meta, 0, 1);
    return clamp(dv*0.6 + rs*0.4, 0, 1);
  }
  return clamp((st.reserva+st.invest)/o.meta, 0, 1);
}
const patrimonio = st => r2(st.dinheiro+st.reserva+st.invest-st.divida);

/* ===================== PROCESSAMENTO DO MÊS ===================== */
function processarMes(){
  const st = state, p = perfil(), ex = [];
  st.dinheiro += CONFIG.renda;
  ex.push({l:'Renda líquida do mês', t:'+ '+fmt(CONFIG.renda), c:'pos'});

  if(p.vr){ st.vr += p.vr; ex.push({l:'Crédito do vale-refeição (VR)', t:'+ '+fmt(p.vr)+' no VR', c:'neu'}); }

  if(st.reserva>0){ const r=r2(st.reserva*CONFIG.rendReserva); st.reserva+=r;
    if(r>=0.01) ex.push({l:'Rendimento da reserva', t:'+ '+fmt(r)+' na reserva', c:'pos'}); }
  if(st.invest>0){ const r=r2(st.invest*CONFIG.rendInvest); st.invest+=r;
    if(r>=0.01) ex.push({l:'Rendimento dos investimentos', t:'+ '+fmt(r)+' investidos', c:'pos'}); }

  st.despesas.forEach(d=>{ st.dinheiro-=d.valor; ex.push({l:d.nome, t:'− '+fmt(d.valor), c:'neg'}); });

  if(p.vr){
    const cons = st.flags.consumoAlim ?? 470;
    const doVr = Math.min(st.vr, cons); st.vr -= doVr;
    ex.push({l:'Alimentação paga com VR', t:'− '+fmt(doVr)+' do VR', c:'neu'});
    const falta = r2(cons - doVr);
    if(falta>0.01){ st.dinheiro-=falta; ex.push({l:'Alimentação além do VR (dinheiro)', t:'− '+fmt(falta), c:'neg'}); }
  }

  st.parcelas.forEach(pc=>{
    if(pc.restantes>0){ st.dinheiro-=pc.valor; pc.restantes--;
      ex.push({l:'Parcela: '+pc.nome+' ('+(pc.total-pc.restantes)+'/'+pc.total+')', t:'− '+fmt(pc.valor), c:'neg'}); }
  });
  st.parcelas = st.parcelas.filter(pc=>pc.restantes>0);

  if(st.divida>0.01){
    const j = r2(st.divida*CONFIG.jurosDivida); st.divida += j;
    ex.push({l:'Juros sobre a dívida ('+(CONFIG.jurosDivida*100).toFixed(0)+'% a.m.)', t:'+ '+fmt(j)+' de dívida', c:'neg'});
    const min = r2(Math.min(st.divida, Math.max(p.parcelaMinima, st.divida*0.12)));
    st.dinheiro -= min; st.divida -= min;
    ex.push({l:'Pagamento da dívida (parcela mínima)', t:'− '+fmt(min), c:'neg'});
  }

  if(st.dinheiro < -0.005){
    let falta = -st.dinheiro; st.dinheiro = 0;
    const r = Math.min(st.reserva, falta); st.reserva -= r; falta -= r;
    if(r>0.005){ ex.push({l:'Retirada automática da reserva para fechar o mês', t:'− '+fmt(r)+' da reserva', c:'neg'}); st.flags.usouReserva=true; }
    if(falta>0.005){ st.divida += falta; st.flags.usouCredito=true; st.flags.mesNegativo=(st.flags.mesNegativo||0)+1;
      ex.push({l:'Faltou dinheiro: uso de crédito emergencial', t:'+ '+fmt(falta)+' de dívida', c:'neg'}); }
  }
  sane();
  st.extrato = ex;
}

          {id:'B', titulo:'Realizar parte agora e o resto depois', detalhe:'R$ 2.500 agora', custo:2500, aplicar(st){
            const f=pagar(st,2500); st.flags.projetoParcial=true;
            return {msg:'Você executou metade do projeto: R$ 2.500. '+f.texto,

            st.flags.esperouFinal=true;
            return {msg:'Você decidiu esperar mais um pouco e manter tudo guardado.',

]
};

/* ---------- ciclo do mês ---------- */
function iniciarMes(){
  processarMes();
  const cenas = ROTEIRO[state.perfilId][state.mes-1](state);
  state.cenas = [{tipo:'abertura'}].concat(cenas).concat([{tipo:'fechamento'}]);
  state.cenaIdx = 0;
  salvar();
  renderCena();
}
function proximaCena(){ state.cenaIdx++; renderCena(); }
function renderCena(){
  const c = state.cenas[state.cenaIdx];
  if(!c){ fecharMes(); return; }
  if(c.tipo==='abertura')     return cenaAbertura();
  if(c.tipo==='consequencia') return cenaConsequencia(c);
  if(c.tipo==='fechamento')   return cenaFechamento();
  return cenaDecisao(c);
}

function cenaAbertura(){
  const st=state, info=CONFIG.mesesInfo[st.mes-1];
  const itens = st.extrato.map(e=>`<div class="it"><span>${e.l}</span><b class="${e.c}">${e.t}</b></div>`).join('');
  desenhar(`
  <div class="card scene up">
    <div class="ilubox">${ILU.cofre}</div>
    <span class="tag">MÊS ${st.mes} — ${info.tema}</span>
    <h2>${info.titulo}</h2>
    <p class="txt">${st.mes===1
      ? 'Sua renda entrou e as obrigações do mês já foram descontadas. O que aparece abaixo é o ponto de partida das suas decisões.'
      : 'Um novo mês começou. Antes de qualquer decisão, veja o que os meses anteriores já reservaram para este.'}</p>
    <div class="extrato">
      <div class="h">MOVIMENTAÇÃO AUTOMÁTICA DO MÊS</div>
      ${itens}
      <div class="tot"><span>Dinheiro disponível para decidir</span><span>${fmt(st.dinheiro)}</span></div>
    </div>
    <div class="acts"><button class="btn" id="next">CONTINUAR →</button></div>
  </div>`);
  document.getElementById('next').onclick = proximaCena;
}

let selecionada = null;
function snapshotFinanceiro(st){
  return {
    dinheiro:r2(st.dinheiro), reserva:r2(st.reserva), invest:r2(st.invest),
    divida:r2(st.divida), parcelas:r2(parcelasMensais(st)), patrimonio:r2(patrimonio(st))
  };
}
function cenaDecisao(c){
  selecionada = null;
  const opts = c.opcoes.map((o,i)=>{
    let aviso='';
    if(o.custo){
      const liquido = state.dinheiro + state.reserva + (state.flags.investBloqueado?0:state.invest);
      if(o.custo > liquido) aviso = `<span class="warn red">Pode exigir crédito</span>`;
      else if(o.custo > state.dinheiro) aviso = `<span class="warn">Pode usar reserva</span>`;
    }
    return `<button class="opt" data-i="${i}">
      <span class="letra">${o.id||String.fromCharCode(65+i)}</span>
      <span><div class="tt">${o.titulo}</div><div class="dd">${o.detalhe||''}</div>${aviso}</span>
    </button>`;
  }).join('');
  const tagClass = /IMPREVISTO|CONSEQUÊNCIA|ACONTECEU/.test(c.tag||'') ? ' ev' : (/ALERTA/.test(c.tag||'')?' al':'');
  desenhar(`<div class="card scene up">
    <div class="ilubox">${ILU[c.ilu]||ILU.cofre}</div>
    <span class="tag${tagClass}">${c.tag||'DECISÃO'}</span>
    <h2>${c.titulo}</h2>
    <p class="txt">${c.texto||''}</p>
    <div class="opts">${opts}</div>
    <div class="acts"><button class="btn" id="confirm" disabled>CONFIRMAR DECISÃO</button></div>
  </div>`);
  const botoes=[...app.querySelectorAll('.opt')];
  const confirmar=document.getElementById('confirm');
  botoes.forEach((b,i)=>b.onclick=()=>{
    // O jogador pode trocar de alternativa livremente até confirmar.
    botoes.forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    selecionada=i;
    confirmar.disabled=false;
  });
  confirmar.onclick=()=>{
    if(selecionada===null) return;
    confirmar.disabled=true;
    botoes.forEach((b,i)=>{ if(i!==selecionada)b.classList.add('off'); });
    const o=c.opcoes[selecionada];
    const antes=snapshotFinanceiro(state);
    let ret={msg:'Decisão registrada.',exp:''};
    try{ ret=o.aplicar?o.aplicar(state)||ret:ret; }catch(err){
      console.error(err); ret={msg:'A decisão foi registrada, mas ocorreu um erro ao aplicar o efeito.',exp:'O restante da jornada continuará normalmente.'};
    }
    sane();
    const depois=snapshotFinanceiro(state);
    state.historico.push({mes:state.mes,titulo:c.titulo,escolha:o.titulo,antes,depois,exp:ret.exp||''});
    salvar();
    state.cenas.splice(state.cenaIdx+1,0,{tipo:'consequencia',titulo:c.titulo,escolha:o.titulo,msg:ret.msg||'',exp:ret.exp||'',antes,depois,ilu:c.ilu});
    proximaCena();
  };
}

function cenaConsequencia(c){
  const a=c.antes,d=c.depois;
  const deltas=[];
  [['Dinheiro disponível','dinheiro'],['Reserva','reserva'],['Investimentos','invest'],['Dívida','divida']].forEach(([nome,k])=>{
    const v=r2(d[k]-a[k]);
    if(Math.abs(v)>=0.01) deltas.push(`<div class="delta"><span>${nome}</span><b class="${v>=0?'pos':'neg'}">${sgn(v)}</b></div>`);
  });
  const pdelta=r2(d.parcelas-a.parcelas);
  if(Math.abs(pdelta)>=0.01) deltas.push(`<div class="delta"><span>Parcelas mensais</span><b class="${pdelta>=0?'neg':'pos'}">${sgn(pdelta)}</b></div>`);
  desenhar(`<div class="card scene up">
    <div class="ilubox">${ILU[c.ilu]||ILU.cofre}</div>
    <span class="tag">CONSEQUÊNCIA</span>
    <h2>${c.escolha}</h2>
    <p class="txt">${c.msg}</p>
    <div class="conseq">
      <div class="snap"><div class="k">PATRIMÔNIO ANTES</div><div class="v">${fmt(a.patrimonio)}</div></div>
      <div class="arrow">→</div>
      <div class="snap after"><div class="k">PATRIMÔNIO DEPOIS</div><div class="v">${fmt(d.patrimonio)}</div></div>
    </div>
    ${deltas.length?`<div class="deltas">${deltas.join('')}</div>`:''}
    ${c.exp?`<div class="lesson"><div class="k">POR TRÁS DA SUA DECISÃO</div><p>${c.exp}</p></div>`:''}
    <div class="acts"><button class="btn" id="next">CONTINUAR →</button></div>
  </div>`);
  document.getElementById('next').onclick=proximaCena;
}

function cenaFechamento(){
  const st=state;
  // Snapshot da tela: permite experimentar distribuições e voltar atrás antes de fechar o mês.
  const inicial = {
    dinheiro:r2(st.dinheiro), reserva:r2(st.reserva), invest:r2(st.invest), divida:r2(st.divida)
  };
  const movimentos=[];

  desenhar(`<div class="card scene up">
    <span class="tag">FECHAMENTO DO MÊS</span>
    <h2>Como você quer organizar o dinheiro que restou?</h2>
    <p class="txt">Antes de encerrar o mês, você pode distribuir parte do valor disponível. <b>Nada é definitivo até você fechar o mês:</b> experimente e, se mudar de ideia, use “Desfazer” ou “Restaurar valores”.</p>
    <div class="alloc">
      <div class="pot"><div class="k">💰 DISPONÍVEL</div><div class="v" id="pv-d">${fmt(st.dinheiro)}</div><div class="mut" style="font-size:.72rem;margin-top:5px">Fica livre para o próximo mês</div></div>
      <div class="pot"><div class="k">🏦 RESERVA</div><div class="v" id="pv-r">${fmt(st.reserva)}</div><div class="mut" style="font-size:.72rem;margin-top:5px">Proteção para imprevistos</div></div>
      <div class="pot"><div class="k">📈 INVESTIMENTOS</div><div class="v" id="pv-i">${fmt(st.invest)}</div><div class="mut" style="font-size:.72rem;margin-top:5px">Aplicado para render; pode ter menos liquidez</div></div>
      <div class="pot"><div class="k">💳 DÍVIDA</div><div class="v" id="pv-v">${fmt(st.divida)}</div><div class="mut" style="font-size:.72rem;margin-top:5px">Valor que ainda precisa ser pago</div></div>
    </div>

    <div class="lesson" style="margin-bottom:16px">
      <div class="k">COMO FUNCIONA?</div>
      <p><b>Disponível</b> fica acessível para o próximo mês. <b>Reserva</b> é o dinheiro separado para proteção. <b>Investimentos</b> representam dinheiro aplicado buscando rendimento — não é “dinheiro extra” e pode ter menos acesso imediato dependendo da aplicação.</p>
    </div>

    <div class="mover">
      <div class="spread" style="margin-bottom:8px"><div><b>Escolha um valor</b><div class="mut" style="font-size:.82rem">Você pode fazer mais de uma movimentação.</div></div><div class="mut" id="limiteMover">Máximo: ${fmt(Math.max(0,st.dinheiro))}</div></div>
      <input id="valorMover" inputmode="decimal" value="${Math.max(0,r2(st.dinheiro*0.5)).toFixed(2)}" aria-label="Valor para mover">
      <div class="quick"><button data-q="0.25">25%</button><button data-q="0.5">50%</button><button data-q="1">100%</button></div>
      <div class="dest">
        <button data-d="reserva">🏦 Colocar na reserva</button>
        <button data-d="invest">📈 Aplicar em investimento</button>
        ${st.divida>0.01?'<button data-d="divida">💳 Abater dívida</button>':''}
        <button data-d="manter">💰 Manter disponível</button>
      </div>
      <div class="hist" id="movMsg">Nenhuma movimentação feita nesta tela.</div>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" id="undoMov" disabled>↶ Desfazer última</button>
        <button class="btn ghost" id="resetMov" disabled>↺ Restaurar valores</button>
      </div>
    </div>
    <div class="acts"><button class="btn" id="fechar">${st.mes<CONFIG.meses?'FECHAR MÊS E CONTINUAR →':'FINALIZAR JORNADA →'}</button></div>
  </div>`);

  const inp=document.getElementById('valorMover');
  const msg=document.getElementById('movMsg');
  const undo=document.getElementById('undoMov');
  const reset=document.getElementById('resetMov');
  const atualizar=()=>{
    document.getElementById('pv-d').textContent=fmt(st.dinheiro);
    document.getElementById('pv-r').textContent=fmt(st.reserva);
    document.getElementById('pv-i').textContent=fmt(st.invest);
    document.getElementById('pv-v').textContent=fmt(st.divida);
    document.getElementById('limiteMover').textContent='Máximo: '+fmt(Math.max(0,st.dinheiro));
    undo.disabled=movimentos.length===0;
    reset.disabled=movimentos.length===0;
  };
  const snapshot=()=>({dinheiro:r2(st.dinheiro),reserva:r2(st.reserva),invest:r2(st.invest),divida:r2(st.divida)});
  const restaurar=(x)=>{ st.dinheiro=x.dinheiro; st.reserva=x.reserva; st.invest=x.invest; st.divida=x.divida; sane(); atualizar(); salvar(); };

  app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
    inp.value=r2(Math.max(0,st.dinheiro)*Number(b.dataset.q)).toFixed(2);
  });

  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    const dest=b.dataset.d;
    if(dest==='manter'){
      msg.textContent='Tudo certo: o valor que permanecer em “Disponível” seguirá livre para o próximo mês.';
      return;
    }
    let v=Number(String(inp.value).replace(',','.'));
    if(!Number.isFinite(v)||v<=0){ msg.textContent='Digite um valor maior que zero.'; return; }
    if(v>st.dinheiro+0.005){ msg.textContent='Esse valor é maior do que o dinheiro disponível. Ajuste o valor antes de continuar.'; return; }
    v=r2(v);
    const antes=snapshot();
    st.dinheiro-=v;
    let texto='';
    if(dest==='reserva'){
      st.reserva+=v;
      texto=`${fmt(v)} foram separados na reserva.`;
    }
    if(dest==='invest'){
      st.invest+=v;
      texto=`${fmt(v)} foram aplicados em investimentos. Esse valor continua sendo seu, mas agora está separado do dinheiro disponível.`;
    }
    if(dest==='divida'){
      const abat=Math.min(v,st.divida); st.divida-=abat; const sobra=r2(v-abat); st.dinheiro+=sobra;
      texto=`${fmt(abat)} foram usados para reduzir a dívida.`+(sobra>0?` ${fmt(sobra)} voltaram ao disponível porque a dívida foi totalmente quitada.`:'');
    }
    sane();
    movimentos.push({antes,texto});
    atualizar(); salvar();
    msg.textContent=texto+' Você ainda pode mudar de ideia antes de fechar o mês.';
    inp.value=r2(Math.max(0,st.dinheiro)*0.5).toFixed(2);
  });

  undo.onclick=()=>{
    if(!movimentos.length) return;
    const mov=movimentos.pop();
    restaurar(mov.antes);
    msg.textContent=movimentos.length ? 'Última movimentação desfeita. As anteriores foram mantidas.' : 'Movimentação desfeita. Você voltou aos valores do início desta tela.';
    inp.value=r2(Math.max(0,st.dinheiro)*0.5).toFixed(2);
  };

  reset.onclick=()=>{
    restaurar(inicial);
    movimentos.length=0;
    atualizar();
    msg.textContent='Valores restaurados. Você pode escolher uma nova distribuição do zero.';
    inp.value=r2(Math.max(0,st.dinheiro)*0.5).toFixed(2);
  };

  atualizar();
  document.getElementById('fechar').onclick=fecharMes;
}
function fecharMes(){
  const st=state;
  st.serie.push({mes:st.mes,reserva:st.reserva,invest:st.invest,dinheiro:st.dinheiro,divida:st.divida,patrimonio:patrimonio(st)});
  if(st.mes>=CONFIG.meses){ st.mes=CONFIG.meses+1; salvar(); return telaFinal(); }
  st.mes++; salvar(); iniciarMes();
}

function indiceSaude(st){
  const renda=CONFIG.renda;
  const reservaMeses = custoMensalTotal(st)>0 ? (st.reserva/custoMensalTotal(st)) : 3;
  const protecao=clamp(reservaMeses/3,0,1);
  const endiv=clamp(1-(st.divida/(renda*2.5)),0,1);
  const comprom=clamp(1-(parcelasMensais(st)/renda),0,1);
  const objetivo=progressoObjetivo(st);
  const patrimonioScore=clamp((patrimonio(st)+renda)/(renda*4),0,1);
  let score=Math.round((protecao*.24+endiv*.24+comprom*.18+objetivo*.20+patrimonioScore*.14)*100);
  score-=Math.min(15,(st.flags.impulso||0)*3);
  score-=Math.min(15,(st.flags.mesNegativo||0)*5);
  return clamp(score,0,100);
}
function diagnostico(st,score){
  if(st.divida>CONFIG.renda || parcelasMensais(st)>CONFIG.renda*.35 || score<40)
    return {nome:'ENDIVIDADO',cor:'linear-gradient(135deg,#b91c1c,#ef4444)',texto:'Seus compromissos cresceram além da sua margem atual. A prioridade agora é recuperar espaço no orçamento e reduzir o custo das dívidas.'};
  if((st.flags.impulso||0)>=3 || score<60)
    return {nome:'IMPULSIVO',cor:'linear-gradient(135deg,#c2410c,#f59e0b)',texto:'Você priorizou várias decisões imediatas. Algumas foram possíveis, mas reduziram sua liberdade financeira nos meses seguintes.'};
  if(score<80)
    return {nome:'EQUILIBRISTA',cor:'linear-gradient(135deg,#a16207,#eab308)',texto:'Você conseguiu conciliar consumo, segurança e objetivos, embora algumas escolhas tenham criado pontos de atenção.'};
  return {nome:'PLANEJADOR',cor:'linear-gradient(135deg,#047857,#10b981)',texto:'Você demonstrou consistência, preservou margem para imprevistos e tomou decisões alinhadas ao contexto financeiro.'};
}
function telaFinal(){
  const st=state,p=perfil(),score=indiceSaude(st),diag=diagnostico(st,score),prog=Math.round(progressoObjetivo(st)*100);
  const cf=compromissosFuturos(st), pm=parcelasMensais(st);
  const pontos=[];
  if(st.flags.usouReserva) pontos.push('🏦 Sua reserva foi acionada em algum momento da jornada. Isso mostra como proteção financeira muda as alternativas disponíveis.');
  if((st.flags.parcelou||0)>0) pontos.push(`📆 Você assumiu ${st.flags.parcelou} parcelamento(s). Ao final, ainda há ${fmt(cf)} em compromissos futuros.`);
  if((st.flags.impulso||0)>0) pontos.push(`🛍️ Você registrou ${st.flags.impulso} decisão(ões) de consumo por impulso ou crédito para desejo.`);
  if(st.flags.rendaExtra) pontos.push('💼 Você aproveitou uma oportunidade de renda extra durante a jornada.');
  if(st.divida<=0.01 && p.id==='p3') pontos.push('✅ Você encerrou a jornada sem saldo de dívida original.');
  if(!pontos.length) pontos.push('📌 Sua trajetória foi relativamente estável. O principal aprendizado está no equilíbrio entre liquidez, objetivo e liberdade de escolha.');
  const hist=st.historico.slice(-8).map((h,i)=>`<button data-h="${i}"><b>Mês ${h.mes}: ${esc(h.escolha)}</b><small>${esc(h.titulo)}</small></button>`).join('');
  app.innerHTML=`
    <div class="final-hero fade"><h2>SUA JORNADA</h2><p>6 meses concluídos — ${p.nome}</p></div>
    <div class="res up">
      <div class="b"><div class="k">💰 DISPONÍVEL</div><div class="v">${fmt(st.dinheiro)}</div></div>
      <div class="b"><div class="k">🏦 RESERVA</div><div class="v">${fmt(st.reserva)}</div></div>
      <div class="b"><div class="k">📈 INVESTIMENTOS</div><div class="v">${fmt(st.invest)}</div></div>
      <div class="b"><div class="k">💳 DÍVIDAS</div><div class="v">${fmt(st.divida)}</div></div>
      <div class="b"><div class="k">📆 PARCELAS</div><div class="v">${fmt(pm)}/mês</div></div>
      <div class="b"><div class="k">🎯 OBJETIVO</div><div class="v">${prog}%</div></div>
    </div>
    <div class="diag up" style="background:${diag.cor}">
      <div class="k">SEU PERFIL FINANCEIRO</div><h3>${diag.nome}</h3><p>${diag.texto}</p>
      <div class="score"><div class="n">${score}</div><div><div style="font-size:.75rem;margin-bottom:6px">ÍNDICE DE SAÚDE FINANCEIRA</div><div class="bar"><b style="width:${score}%"></b></div></div></div>
    </div>
    <div class="card up"><h3 style="margin-bottom:12px">O que sua jornada mostrou?</h3><div class="pontos">${pontos.map(x=>`<div class="ponto">${x}</div>`).join('')}</div></div>
    <div class="card up" style="margin-top:18px"><h3>Se pudesse voltar, qual decisão você mudaria?</h3>
      <p class="mut">Escolha uma das decisões recentes para refletir sobre o efeito acumulado.</p><div class="chips2">${hist}</div>
      <div class="lesson" id="reflexao" style="display:none"><div class="k">REFLEXÃO</div><p></p></div>
    </div>
    <div class="card up" style="margin-top:18px;text-align:center"><p><b>Não existe uma única forma de cuidar do seu dinheiro.</b><br>O importante é entender suas escolhas, conhecer suas consequências e tomar decisões alinhadas à realidade que você deseja construir.</p>
      <button class="btn lg" id="again">JOGAR NOVAMENTE</button></div>`;
  const rec=st.historico.slice(-8);
  app.querySelectorAll('[data-h]').forEach((b,i)=>b.onclick=()=>{
    app.querySelectorAll('[data-h]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
    const h=rec[i], box=document.getElementById('reflexao'); box.style.display='block';
    box.querySelector('p').textContent=`Você escolheu “${h.escolha}”. ${h.exp||'Uma escolha diferente mudaria o dinheiro, os compromissos ou as alternativas disponíveis nos meses seguintes.'}`;
  });
  document.getElementById('again').onclick=()=>{limparSave();state=null;hudAnterior={};telaPerfis();};
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- inicialização ---------- */
telaInicio();
</script>
